# nginx-geo-block.conf — country-based blocking for Nginx (GeoIP2 module).
#
# Include this file inside the http{} block (for the geoip2 database + map)
# AND inside any server{} block where blocking should apply (the "if" guard).
# The two parts are marked below; split them if your layout needs it.
#
# Requires: libnginx-mod-http-geoip2 (Debian/Ubuntu) and a
# GeoLite2-Country.mmdb database — see setup-geoip.sh.
#
# ---------------- http{} part ----------------
# geoip2 /etc/nginx/geoip/GeoLite2-Country.mmdb {
#     $geoip2_data_country_code country iso_code;
# }
#
# # 1 = blocked, 0 = allowed. Edit blocked-countries.conf for your list.
# map $geoip2_data_country_code $geo_blocked {
#     default 0;
#     include /etc/nginx/blocked-countries.conf;
# }
#
# ---------------- server{} part ----------------
# # 451 = "Unavailable For Legal Reasons" — the honest status for a
# # geo-block (as opposed to 403, which implies the resource exists but
# # this user is not allowed). Return it before any content is served.
# if ($geo_blocked) {
#     return 451;
# }
#
# NOTE: this file is documentation + copy-paste snippet, not a file Nginx
# can include directly — the http{} and server{} parts must live in their
# respective contexts. setup-geoip.sh installs the database and verifies
# the module; blocked-countries.conf is the ready-to-include map body.
